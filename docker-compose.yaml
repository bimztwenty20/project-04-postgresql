services:
  postgres:
    image: postgres:16
    container_name: project04-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bimz
      POSTGRES_PASSWORD: twenty
      POSTGRES_DB: project04

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: